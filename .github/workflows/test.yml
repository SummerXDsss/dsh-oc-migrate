name: Test
on: [push, pull_request, workflow_call]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run desktop:web:build
      - run: npm run check
      - run: npm test
      - run: npm run test:package
  native-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: npm run desktop:prepare
      - name: Install pinned OpenCode binaries in isolated folders
        run: |
          npm install --prefix "$RUNNER_TEMP/oc-v1" opencode-ai@1.18.31 --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/oc-v2" @opencode/cli@2.3.2 --no-audit --no-fund
      - name: Bidirectional native CLI, compiled desktop, server, and rollback regression
        run: |
          DSH_NATIVE_APP_ROOT="$PWD" \
          DSH_OC_TEST_SIDECAR="$PWD/src-tauri/binaries/migrate-backend-x86_64-unknown-linux-gnu" \
          OPENCODE_V1_BIN="$RUNNER_TEMP/oc-v1/node_modules/.bin/opencode" \
          OPENCODE_V2_BIN="$RUNNER_TEMP/oc-v2/node_modules/.bin/opencode" \
          npm run test:integration
  desktop-check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run desktop:prepare
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked
