name: Test
on: [push, pull_request, workflow_call]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run desktop:web:build
      - run: npm run check
      - run: npm test
      - run: npm run test:package
  native-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: npm run desktop:prepare
      - name: Install pinned OpenCode binaries in isolated folders
        run: |
          npm install --prefix "$RUNNER_TEMP/oc-v1" opencode-ai@1.18.31 --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/oc-v2" @opencode/cli@2.3.2 --no-audit --no-fund
      - name: Native CLI, server, and rollback regression
        run: |
          DSH_OC_TEST_SIDECAR="$PWD/src-tauri/binaries/migrate-backend-x86_64-unknown-linux-gnu" \
          OPENCODE_V1_BIN="$RUNNER_TEMP/oc-v1/node_modules/.bin/opencode" \
          OPENCODE_V2_BIN="$RUNNER_TEMP/oc-v2/node_modules/.bin/opencode" \
          npm run test:integration
