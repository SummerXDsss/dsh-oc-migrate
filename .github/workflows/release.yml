name: Desktop Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish installers after validation (otherwise artifacts only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regression:
    uses: ./.github/workflows/test.yml
  build:
    needs: regression
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Build native desktop installers with embedded sidecar
        run: npm run desktop:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci -- --locked
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          MACOSX_DEPLOYMENT_TARGET: '13.0'
      - name: Exercise the compiled sidecar (not Node)
        shell: bash
        run: |
          BIN="$PWD/src-tauri/binaries/migrate-backend-${{ matrix.target }}"
          if [[ "$RUNNER_OS" == "Windows" ]]; then BIN="$BIN.exe"; fi
          DSH_OC_TEST_SIDECAR="$BIN" node --test --test-name-pattern='sidecar JSONL' test/desktop.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Validate version and package DSH Host plugin
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then echo 'Tag/package version mismatch'; exit 1; fi
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"
          npm pack --pack-destination release-assets
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Publish only when all platforms and regressions succeeded
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; use a new version instead of replacing published binaries"; exit 1
          else
            gh release create "$RELEASE_TAG" release-assets/* --target "$GITHUB_SHA" \
              --title "DSH → OpenCode $RELEASE_TAG" --notes-file docs/RELEASE.md
          fi
