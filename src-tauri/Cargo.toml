[package]
name = "dsh-oc-migrate-desktop"
version = "0.5.7"
description = "DeepSeek Harness history migration desktop"
authors = ["SummerXDsss"]
edition = "2021"
license = "MIT"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
tauri-plugin-opener = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
